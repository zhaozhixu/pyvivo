[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pyvivo"
version = "0.1.0"
description = "Experimental live inspection and patching for running CPython processes"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
authors = [
    { name = "pyvivo contributors" },
]
keywords = ["cpython", "debugging", "pep-768", "runtime", "hot-patching"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Debuggers",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
pyvivo = "pyvivo.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pyvivo"]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.hatch.build.targets.sdist]
include = ["src/pyvivo", "example", "tests", "README.md", "LICENSE"]
